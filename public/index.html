<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width" />
  <meta name="description" content="Owen Loveluck" />
  <title>Owen Loveluck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-family: 'JetBrains Mono', monospace;
      background: #0a0a0a;
      color: #b0b0b0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      line-height: 1.7;
      font-size: 14px;
    }

    .wrapper {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 16px;
      font-weight: 500;
      color: #e0e0e0;
      margin-bottom: 1.5rem;
    }

    .bio {
      margin-bottom: 1.5rem;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
    }

    .links a {
      color: #707070;
      display: flex;
      transition: color 0.15s;
    }

    .links a:hover {
      color: #e0e0e0;
    }

    a {
      color: #707070;
      text-decoration: none;
    }

    a:hover {
      color: #e0e0e0;
    }

    footer {
      position: fixed;
      bottom: 1rem;
      left: 0;
      right: 0;
      text-align: center;
    }

    footer a {
      font-size: 11px;
      color: #1a1a1a;
    }

    footer a:hover {
      color: #333;
    }

    footer .separator {
      color: #1a1a1a;
      margin: 0 0.5rem;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <script type="module" src="main.js"></script>
</body>
</html>
