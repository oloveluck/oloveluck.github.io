<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width" />
  <meta name="description" content="Owen Loveluck" />
  <title>Owen Loveluck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-family: 'JetBrains Mono', monospace;
      background: #0a0a0a;
      color: #b0b0b0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      line-height: 1.7;
      font-size: 14px;
    }

    .wrapper {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 16px;
      font-weight: 500;
      color: #e0e0e0;
      margin-bottom: 1.5rem;
    }

    .bio {
      margin-bottom: 1.5rem;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
    }

    .links a {
      color: #707070;
      display: flex;
      transition: color 0.15s;
    }

    .links a:hover {
      color: #e0e0e0;
    }

    a {
      color: #707070;
      text-decoration: none;
    }

    a:hover {
      color: #e0e0e0;
    }

    footer {
      position: fixed;
      bottom: 1rem;
      left: 0;
      right: 0;
      text-align: center;
    }

    footer a {
      font-size: 11px;
      color: #1a1a1a;
    }

    footer a:hover {
      color: #333;
    }

    footer .separator {
      color: #1a1a1a;
      margin: 0 0.5rem;
      font-size: 11px;
    }

    /* Opinions link on home page */
    .opinions-link {
      margin-top: 1.5rem;
    }

    .opinions-link a {
      color: #707070;
      font-size: 13px;
    }

    .opinions-link a:hover {
      color: #e0e0e0;
    }

    /* Opinions list page */
    .opinions-wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2rem 1.5rem;
      align-self: flex-start;
      margin-top: 3rem;
    }

    .opinions-header {
      margin-bottom: 2rem;
    }

    .opinions-header h1 {
      font-size: 16px;
      font-weight: 500;
      color: #e0e0e0;
      margin-top: 0.5rem;
    }

    .back-link {
      color: #505050;
      font-size: 12px;
    }

    .back-link:hover {
      color: #808080;
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .post-preview {
      display: flex;
      gap: 1.5rem;
      padding: 0.5rem 0;
      text-decoration: none;
    }

    .post-preview:hover .post-title {
      color: #e0e0e0;
    }

    .post-preview .post-date {
      color: #505050;
      font-size: 13px;
      flex-shrink: 0;
    }

    .post-preview .post-title {
      color: #909090;
      font-size: 13px;
      transition: color 0.15s;
    }

    /* Individual post page */
    .post-wrapper {
      max-width: 750px;
      width: 100%;
      padding: 2rem 1.5rem;
      align-self: flex-start;
      margin-top: 3rem;
    }

    .post-header {
      margin-bottom: 2rem;
    }

    .post-content h1 {
      font-size: 18px;
      font-weight: 500;
      color: #e0e0e0;
      margin-bottom: 0.5rem;
    }

    .post-content .post-date {
      color: #505050;
      font-size: 12px;
      margin-bottom: 2rem;
    }

    .post-body {
      color: #b0b0b0;
      line-height: 1.8;
    }

    .post-body h2 {
      font-size: 14px;
      font-weight: 500;
      color: #d0d0d0;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }

    .post-body p {
      margin-bottom: 1rem;
    }

    .post-body code {
      background: #1a1a1a;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
    }

    .post-body pre {
      background: #1a1a1a;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      margin: 1rem 0;
    }

    .post-body pre code {
      background: none;
      padding: 0;
    }

    .post-body ul, .post-body ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }

    .post-body li {
      margin-bottom: 0.5rem;
    }

    .post-body blockquote {
      border-left: 2px solid #333;
      padding-left: 1rem;
      color: #808080;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <script type="module" src="main.js"></script>
</body>
</html>
